{% extends "base.html" %}{% block content %}<h2>Attendance Summary</h2><form class="d-flex gap-2 mb-3"><input class="form-control w-auto" type="month" name="month" value="{{ month }}"><button class="btn btn-primary">View</button></form><div class="card p-3"><table class="table"><tr><th>Employee</th><th>Status</th><th>Count</th></tr>{% for r in rows %}<tr><td>{{ r.employee__employee_code }} - {{ r.employee__first_name }} {{ r.employee__last_name }}</td><td>{{ r.status }}</td><td>{{ r.count }}</td></tr>{% empty %}<tr><td colspan="3">No attendance records.</td></tr>{% endfor %}</table></div>{% endblock %}
