{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between mb-3"><h2>Departments</h2><a class="btn btn-primary" href="{% url 'department_create' %}">+ Add Department</a></div><div class="card p-3"><table class="table"><tr><th>ID</th><th>Department</th><th>Description</th><th>Employees</th><th></th></tr>{% for d in departments %}<tr><td>{{ d.department_id }}</td><td>{{ d.department_name }}</td><td>{{ d.description|default:'-' }}</td><td>{{ d.employee_count }}</td><td><a class="btn btn-sm btn-outline-primary" href="{% url 'department_edit' d.pk %}">Edit</a> <form class="d-inline" method="post" action="{% url 'department_delete' d.pk %}">{% csrf_token %}<button class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete department?')">Delete</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
